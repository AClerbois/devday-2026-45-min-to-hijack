<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demandez au DevDay</title>
<style>
  :root { --ink:#141416; --muted:#5a5a60; --accent:#d9481c; --line:#dadadf; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #fff; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 32px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  textarea { width: 100%; height: 110px; padding: 12px; font: inherit; border: 2px solid var(--line); border-radius: 10px; resize: vertical; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  button, a.btn { min-height: 44px; padding: 0 20px; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; text-decoration: none; }
  button { background: var(--accent); color: #fff; border: 0; }
  button:disabled { opacity: .6; cursor: wait; }
  a.btn { border: 2px solid var(--line); color: var(--ink); }
  #answer { white-space: pre-wrap; margin-top: 24px; padding: 16px; border-radius: 10px; background: #f4f4f6; min-height: 56px; }
  #answer.error { background: #fdecea; }
  #status { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .chip.on { border-color: var(--ink); color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Demandez au DevDay</h1>
  <p class="sub">L'assistant de la session « 60 minutes chrono ». Il est peut-être en train de tomber en panne.</p>

  <label for="q">Votre question</label>
  <textarea id="q" maxlength="500" placeholder="Où a lieu le DevDay ? Quelle session ne pas rater ?"></textarea>
  <div class="row">
    <button id="send" type="button">Envoyer</button>
    <a class="btn" href="/api/export" target="_blank" rel="noopener">Exporter l'historique</a>
  </div>

  <div id="answer" aria-live="polite"></div>

  <div id="status" aria-label="Configuration active"></div>
</main>

<script>
  let uid;
  try { uid = localStorage.getItem("uid") || crypto.randomUUID(); localStorage.setItem("uid", uid); }
  catch { uid = crypto.randomUUID(); }

  const q = document.getElementById("q");
  const send = document.getElementById("send");
  const answer = document.getElementById("answer");
  const status = document.getElementById("status");

  async function ask() {
    if (!q.value.trim()) return;
    send.disabled = true;
    answer.className = "";
    answer.textContent = "…";
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-User": uid },
        body: JSON.stringify({ question: q.value })
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) answer.className = "error";
      answer.textContent = body.answer || `Erreur ${res.status}`;
    } catch {
      answer.className = "error";
      answer.textContent = "L'app ne répond pas pour le moment.";
    } finally {
      send.disabled = false;
    }
  }

  // Bandeau d'état : la configuration active. Les protections n'apparaissent qu'une fois activées.
  async function refreshStatus() {
    try {
      const s = await (await fetch("/api/status")).json();
      const chips = [
        ["Région", s.region, false],
        ["Modèle", s.model, false],
        ["Auth", s.auth, false],
      ];
      if (s.mode === "local") chips.push(["Mode", "local", true]);
      if (s.fallbackModel) chips.push(["Secours", s.fallbackModel, true]);
      if (s.rateLimit) chips.push(["Limite", "5 / min", true]);
      if (s.promptGuard) chips.push(["Prompt", "durci", true]);
      if (!s.export) chips.push(["Export", "désactivé", true]);
      status.replaceChildren(...chips.map(([k, v, on]) => {
        const el = document.createElement("span");
        el.className = "chip" + (on ? " on" : "");
        el.textContent = `${k} : ${v}`;
        return el;
      }));
    } catch {
      status.textContent = "État indisponible";
    }
  }

  send.addEventListener("click", ask);
  q.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask(); });
  refreshStatus();
  setInterval(refreshStatus, 15000);
</script>
</body>
</html>
